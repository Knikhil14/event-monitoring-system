<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Event Monitoring System workflow</title>
  <desc id="desc">Graphical workflow from clients through event ingestion, RabbitMQ, asynchronous processing, PostgreSQL, notifications, dashboard queries, Kubernetes, Prometheus and Grafana.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e8f0f8"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#145da0"/><stop offset="1" stop-color="#0b3c5d"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6a623"/><stop offset="1" stop-color="#dc6b19"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#17324d" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#39708f"/></marker>
    <marker id="arrowAccent" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#d56c1d"/></marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill: #12324a; }
      .subtitle { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #527087; }
      .label { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .small { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #d9edf8; }
      .darkLabel { font: 700 17px 'Segoe UI', Arial, sans-serif; fill: #12324a; }
      .darkSmall { font: 400 14px 'Segoe UI', Arial, sans-serif; fill: #527087; }
      .section { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #39708f; letter-spacing: 2px; }
      .line { fill: none; stroke: #39708f; stroke-width: 3; marker-end: url(#arrow); }
      .accentLine { fill: none; stroke: #d56c1d; stroke-width: 3; marker-end: url(#arrowAccent); }
      .dash { fill: none; stroke: #7d9caf; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
  </defs>
  <rect width="1600" height="980" fill="url(#bg)"/>
  <path d="M0 150 C330 80 520 200 820 125 S1300 70 1600 145 L1600 0 L0 0 Z" fill="#d9eaf5" opacity=".55"/>
  <text x="80" y="72" class="title">Event Monitoring System</text>
  <text x="80" y="105" class="subtitle">End-to-end event ingestion, asynchronous processing, alerting, querying, and observability</text>

  <text x="80" y="175" class="section">EVENT PRODUCERS</text>
  <rect x="80" y="205" width="240" height="112" rx="16" fill="#fff" stroke="#aac5d5" stroke-width="2" filter="url(#shadow)"/>
  <text x="200" y="247" text-anchor="middle" class="darkLabel">Client / Test Script</text>
  <text x="200" y="275" text-anchor="middle" class="darkSmall">POST /api/events</text>
  <text x="200" y="298" text-anchor="middle" class="darkSmall">application, security, performance</text>

  <text x="395" y="175" class="section">INGESTION</text>
  <rect x="385" y="205" width="250" height="112" rx="16" fill="url(#primary)" filter="url(#shadow)"/>
  <text x="510" y="247" text-anchor="middle" class="label">event-ingestor</text>
  <text x="510" y="275" text-anchor="middle" class="small">Flask API + validation</text>
  <text x="510" y="298" text-anchor="middle" class="small">Redis cache + metrics</text>

  <text x="720" y="175" class="section">MESSAGE BROKER</text>
  <rect x="705" y="205" width="270" height="112" rx="16" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="840" y="247" text-anchor="middle" class="label">RabbitMQ</text>
  <text x="840" y="275" text-anchor="middle" class="small">event_queue</text>
  <text x="840" y="298" text-anchor="middle" class="small">durable asynchronous delivery</text>

  <text x="1055" y="175" class="section">PROCESSING</text>
  <rect x="1035" y="205" width="270" height="112" rx="16" fill="url(#primary)" filter="url(#shadow)"/>
  <text x="1170" y="247" text-anchor="middle" class="label">event-processor</text>
  <text x="1170" y="275" text-anchor="middle" class="small">FastAPI + background consumer</text>
  <text x="1170" y="298" text-anchor="middle" class="small">retry failed messages</text>

  <path d="M320 261 H385" class="line"/><path d="M635 261 H705" class="line"/><path d="M975 261 H1035" class="line"/>

  <text x="80" y="405" class="section">STATE AND ALERTING</text>
  <rect x="120" y="450" width="250" height="112" rx="16" fill="#fff" stroke="#aac5d5" stroke-width="2" filter="url(#shadow)"/>
  <text x="245" y="492" text-anchor="middle" class="darkLabel">Redis</text>
  <text x="245" y="520" text-anchor="middle" class="darkSmall">short-lived event records</text>
  <text x="245" y="543" text-anchor="middle" class="darkSmall">one-hour expiry</text>

  <rect x="510" y="450" width="270" height="112" rx="16" fill="#fff" stroke="#aac5d5" stroke-width="2" filter="url(#shadow)"/>
  <text x="645" y="492" text-anchor="middle" class="darkLabel">PostgreSQL</text>
  <text x="645" y="520" text-anchor="middle" class="darkSmall">events + processed_events</text>
  <text x="645" y="543" text-anchor="middle" class="darkSmall">dashboard query source</text>

  <rect x="925" y="450" width="270" height="112" rx="16" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="1060" y="492" text-anchor="middle" class="label">notification_queue</text>
  <text x="1060" y="520" text-anchor="middle" class="small">critical / high severity</text>
  <text x="1060" y="543" text-anchor="middle" class="small">RabbitMQ durable queue</text>

  <rect x="1335" y="450" width="190" height="112" rx="16" fill="url(#primary)" filter="url(#shadow)"/>
  <text x="1430" y="492" text-anchor="middle" class="label">notification-</text>
  <text x="1430" y="516" text-anchor="middle" class="label">service</text>
  <text x="1430" y="543" text-anchor="middle" class="small">simulated alerts</text>

  <path d="M510 317 C510 370 245 370 245 450" class="line"/>
  <path d="M1170 317 C1170 370 645 370 645 450" class="line"/>
  <path d="M1170 317 C1170 370 1060 370 1060 450" class="accentLine"/>
  <path d="M1195 506 H1335" class="accentLine"/>

  <text x="80" y="650" class="section">QUERY AND USER EXPERIENCE</text>
  <rect x="230" y="700" width="270" height="112" rx="16" fill="#fff" stroke="#aac5d5" stroke-width="2" filter="url(#shadow)"/>
  <text x="365" y="742" text-anchor="middle" class="darkLabel">event-query-api</text>
  <text x="365" y="770" text-anchor="middle" class="darkSmall">recent events + statistics</text>
  <text x="365" y="793" text-anchor="middle" class="darkSmall">FastAPI read service</text>

  <rect x="670" y="700" width="270" height="112" rx="16" fill="url(#primary)" filter="url(#shadow)"/>
  <text x="805" y="742" text-anchor="middle" class="label">dashboard</text>
  <text x="805" y="770" text-anchor="middle" class="small">severity cards</text>
  <text x="805" y="793" text-anchor="middle" class="small">recent processed events</text>

  <path d="M645 562 C645 630 365 630 365 700" class="line"/>
  <path d="M500 756 H670" class="line"/>

  <text x="1050" y="650" class="section">OBSERVABILITY</text>
  <rect x="1060" y="700" width="210" height="112" rx="16" fill="#fff" stroke="#aac5d5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1165" y="742" text-anchor="middle" class="darkLabel">Prometheus</text>
  <text x="1165" y="770" text-anchor="middle" class="darkSmall">scrapes /metrics</text>
  <text x="1165" y="793" text-anchor="middle" class="darkSmall">service counters</text>

  <rect x="1340" y="700" width="190" height="112" rx="16" fill="#fff" stroke="#aac5d5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1435" y="742" text-anchor="middle" class="darkLabel">Grafana</text>
  <text x="1435" y="770" text-anchor="middle" class="darkSmall">health dashboards</text>
  <text x="1435" y="793" text-anchor="middle" class="darkSmall">event metrics</text>
  <path d="M1170 317 C1170 600 1165 600 1165 700" class="dash"/>
  <path d="M1165 756 H1340" class="line"/>

  <rect x="80" y="875" width="1450" height="55" rx="14" fill="#12324a"/>
  <text x="805" y="909" text-anchor="middle" class="label">Kubernetes: namespace, Deployments, StatefulSets, Services, ConfigMaps, Secrets, probes, Job, Ingress, resource limits</text>
</svg>
