apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-ingestor
  namespace: event-monitoring
  labels:
    app: event-ingestor
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-ingestor
  template:
    metadata:
      labels:
        app: event-ingestor
    spec:
      containers:
      - name: event-ingestor
        image: kollurinikhil/event-ingestor:latest
        imagePullPolicy: IfNotPresent
        command: ["gunicorn"]
        args: ["--bind", "0.0.0.0:5000", "app:app", "--workers", "1"]
        ports:
        - containerPort: 5000
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: REDIS_HOST
        - name: REDIS_PORT
          value: "6379"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_HOST
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: db-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          value: "5672"
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: event-ingestor-service
  namespace: event-monitoring
spec:
  selector:
    app: event-ingestor
  ports:
  - port: 80
    targetPort: 5000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: event-ingestor-nodeport
  namespace: event-monitoring
spec:
  selector:
    app: event-ingestor
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30081
  type: NodePort
