apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: event-monitoring
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: db-init
        image: postgres:14-alpine
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secret
              key: password
        command:
        - sh
        - -c
        - |
          until pg_isready -h event-db-postgresql -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 5
          done

          psql -h event-db-postgresql -U postgres -d eventdb <<'SQL'
          CREATE TABLE IF NOT EXISTS events (
              id SERIAL PRIMARY KEY,
              event_type VARCHAR(100) NOT NULL,
              source VARCHAR(100) NOT NULL,
              severity VARCHAR(20) NOT NULL,
              message TEXT,
              metadata JSONB,
              timestamp TIMESTAMP NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          CREATE TABLE IF NOT EXISTS processed_events (
              id SERIAL PRIMARY KEY,
              event_type VARCHAR(100) NOT NULL,
              source VARCHAR(100) NOT NULL,
              severity VARCHAR(20) NOT NULL,
              message TEXT,
              metadata JSONB,
              original_timestamp TIMESTAMP NOT NULL,
              processed_timestamp TIMESTAMP NOT NULL,
              status VARCHAR(20) NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );

          CREATE INDEX IF NOT EXISTS idx_events_timestamp ON events(timestamp);
          CREATE INDEX IF NOT EXISTS idx_events_severity ON events(severity);
          CREATE INDEX IF NOT EXISTS idx_processed_events_status ON processed_events(status);
          CREATE INDEX IF NOT EXISTS idx_processed_events_timestamp ON processed_events(processed_timestamp);
          SQL
